context:
  version: "0.3.2"

recipe:
  name: conda-completion-split
  version: ${{ version }}

source:
  url: https://github.com/conda-incubator/conda-completion/archive/refs/tags/${{ version }}.tar.gz
  sha256: 4456f534b5ed679591e5b91a80f39e615c3b2c82f05d7e68eb9c2f6dc06319a0

build:
  number: 0

outputs:
  - package:
      name: conda-completer
      version: ${{ version }}
    build:
      number: 0
      python:
        version_independent: true
      script:
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_PROFILE_RELEASE_LTO: fat
        content:
          - if: unix
            then:
              - ${{ PYTHON }} -m pip install packages/conda-completer -vv --no-deps --no-build-isolation
            else:
              - ${{ PYTHON }} -m pip install packages\conda-completer -vv --no-deps --no-build-isolation
    requirements:
      build:
        - maturin >=1.0,<2.0
        - ${{ compiler('rust') }}
        - ${{ stdlib('c') }}
        - if: build_platform != target_platform
          then:
            - python ${{ python_min }}.*
            - cross-python_${{ target_platform }}
      host:
        - python ${{ python_min }}.*
        - pip
        - maturin >=1.0,<2.0
      run:
        - python >=${{ python_min }}
    tests:
      - python:
          imports:
            - conda_completer
          pip_check: false
          python_version:
            - ${{ python_min }}.*
            - "*"
      - package_contents:
          files:
            - python-scripts/_conda_completer*
      - script:
          - python -c "import subprocess, conda_completer; assert subprocess.run([conda_completer.find_completer_binary()]).returncode == 1"

  - package:
      name: conda-completion
      version: ${{ version }}
    build:
      number: 0
      skip:
        - not linux64
      noarch: python
      script:
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
        content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      build:
        - if: build_platform != target_platform
          then:
            - python ${{ python_min }}.*
            - cross-python_${{ target_platform }}
      host:
        - python ${{ python_min }}.*
        - pip
        - hatchling >=1.12.2
        - hatch-vcs >=0.2.0
      run:
        - python >=${{ python_min }}
        - conda >=25.1
        - conda-completer ==${{ version }}
        - platformdirs >=4.0
        - msgpack-python >=1.0
    tests:
      - python:
          imports:
            - conda_completion
            - conda_completion.plugin
          pip_check: false
          python_version:
            - ${{ python_min }}.*
            - "*"

about:
  homepage: https://github.com/conda-incubator/conda-completion
  repository: https://github.com/conda-incubator/conda-completion
  documentation: https://conda-incubator.github.io/conda-completion/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: >
    Fast shell tab completion for conda and all its plugins.

extra:
  feedstock-name: conda-completion
  recipe-maintainers:
    - jezdez
